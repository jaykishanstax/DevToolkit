<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DevToolkit: All Essential Developer Utilities in One Place.">
    <meta name="theme-color" content="#0F172A">
    <title>DevToolkit</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/tools.css">
    <link rel="stylesheet" href="./styles/responsive.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app" class="app-shell">
      <header class="app-header">
        <div class="header-brand-group">
          <button id="sidebar-toggle" class="icon-button mobile-menu-button" type="button" aria-label="Open navigation" aria-controls="app-sidebar" aria-expanded="false">☰</button>
          <a class="brand" href="#/" aria-label="DevToolkit home">
            <img src="./assets/icons/icon.svg" alt="" width="34" height="34">
            <span><strong>DevToolkit</strong><small>All Essential Developer Utilities in One Place</small></span>
          </a>
        </div>
        <div class="search-shell" role="search">
          <label class="sr-only" for="global-search">Search tools</label>
          <input id="global-search" type="search" placeholder="Search tools..." autocomplete="off" aria-controls="search-results" aria-expanded="false">
          <kbd>⌘K</kbd>
          <div id="search-results" class="search-results" role="listbox" hidden></div>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="button button-ghost" type="button" aria-label="Toggle light mode">☾</button>
          <a class="button button-secondary" href="https://github.com/" target="_blank" rel="noopener noreferrer">
            <img src="./assets/icons/github.svg" alt="" width="18" height="18"> GitHub
          </a>
        </div>
      </header>
      <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
      <div class="app-body">
        <aside id="app-sidebar" class="sidebar" aria-label="Tool navigation">
          <nav id="sidebar-nav"></nav>
        </aside>
        <main id="main-content" class="main-content" tabindex="-1">
          <section id="route-view" aria-live="polite"></section>
        </main>
      </div>
      <footer class="app-footer">
        <span>DevToolkit v1.0.0</span>
        <span>Zero-build static SPA</span>
        <button id="about-button" class="link-button" type="button">About</button>
      </footer>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
